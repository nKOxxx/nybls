[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nybls"
version = "0.9.5"
description = "Low cost, iterative video watching for AI agents. Transcript first, then only the frames it asks for, with receipts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ares" }]
keywords = ["video", "llm", "agent", "vision", "transcript", "ffmpeg", "claude", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
]

[project.optional-dependencies]
macos = ["ocrmac>=1.0"]        # Apple Vision OCR (incl. Arabic); macOS only
download = ["yt-dlp"]              # URL downloads; local files work without it
bench = ["imagehash>=4.3.2"]   # reference hash library for bench/measure_signals.py only
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/nKOxxx/nybls"
Repository = "https://github.com/nKOxxx/nybls"
Issues = "https://github.com/nKOxxx/nybls/issues"

[project.scripts]
nybls = "nybls_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nybls_core"]

[tool.hatch.build.targets.sdist]
include = ["nybls_core", "skills", "README.md", "LICENSE", "docs", ".claude-plugin"]
